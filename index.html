:root {
 color-scheme:light;
 --ink:#202a3b; --muted:#46546a; --paper:#f9f5ed; --key:#286365;
 --display:"Cormorant Garamond",Georgia,serif;
 font:650 16px/1.4 "Manrope","Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid #c1babc;background:#fbf8f0;min-height:44px;padding:.36em .78em;border-radius:8px;line-height:1.2}
button:hover:not(:disabled){background:#ece7de;border-color:#8c8995}
button:disabled{opacity:.4;cursor:default}
button,a,input{touch-action:manipulation}
:focus-visible{outline:3px solid #9a4955;outline-offset:3px}
a{color:#345675;text-underline-offset:.16em}
.backdrop{position:fixed;z-index:-1;inset:0;overflow:hidden;pointer-events:none;background:#f9f5ed}
.backdrop::after{content:"";position:absolute;inset:0;background:linear-gradient(95deg,#faf6ee 0%,#faf6eea8 35%,transparent 80%)}
.wash{position:absolute;width:86vmax;height:73vmax;top:-62%;left:7%;will-change:transform;transition:transform .95s cubic-bezier(.2,.78,.28,1)}
.wash.second{width:74vmax;height:65vmax;top:26%;left:39%}
.wash::before{content:"";position:absolute;inset:0;border-radius:50%;opacity:.62;background:radial-gradient(ellipse at center,#c6d8d8,transparent 66%);animation:float-wash 15s ease-in-out infinite alternate}
.wash.second::before{background:radial-gradient(ellipse at center,#e9c8b8,transparent 64%);animation-duration:19s;animation-direction:alternate-reverse;opacity:.49}
.wash{transform:translate(var(--wash-x,12vw),var(--wash-y,0vh)) rotate(var(--wash-r,0deg))}
.wash.second{transform:translate(var(--echo-x,0vw),var(--echo-y,0vh)) rotate(-15deg)}
@keyframes float-wash{from{transform:translate3d(-3%,-1%,0) scale(.91)}to{transform:translate3d(4%,7%,0) scale(1.04)}}
.shell{width:min(100%,1710px);height:100dvh;margin:auto;padding-inline:clamp(15px,4.7vw,78px);display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
.slide{display:grid;grid-template-columns:minmax(0,.87fr) minmax(0,1.13fr);grid-template-rows:minmax(0,1fr);gap:clamp(21px,4.6vw,74px);align-items:center;padding:clamp(12px,3vh,35px) 0;min-width:0;min-height:0}
.slide[data-tone=air]{--key:#894857}
.slide[data-tone=paper]{--key:#795844}
.copy{min-width:0}
.eyebrow{display:flex;align-items:center;gap:.62em;color:var(--key);font-size:clamp(13px,1.26vw,21px);font-weight:800;letter-spacing:.105em;text-transform:uppercase}
.eyebrow::before{content:"";width:1.45em;height:1px;background:currentColor;flex:none}
.copy h1{margin:.17em 0 .24em;font:700 clamp(44px,5.75vw,97px)/.93 var(--display);letter-spacing:-.045em;text-wrap:balance;overflow-wrap:anywhere}
.copy p{margin:0;max-width:33ch;font-size:clamp(21px,2.08vw,36px);font-weight:790;line-height:1.28;text-wrap:pretty}
.note{margin-top:.75em;max-width:38ch;color:var(--muted);font-size:clamp(17px,1.62vw,27px);line-height:1.35;font-weight:690;text-wrap:pretty}
.byline{list-style:none;padding:.72em 0 0;margin:.85em 0 0;border-top:1px solid #947d744f;display:grid;gap:.18em;font-size:clamp(17px,1.6vw,27px);font-weight:790;color:#3f4b5e}
.byline .class-year{font-weight:820;color:var(--key)}
.plate{position:relative;width:100%;height:auto;margin:0;align-self:center;aspect-ratio:1.12;max-height:min(78vh,725px,100%);min-height:0;min-width:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.plate-heading{font-size:clamp(15px,1.45vw,24px);font-weight:820;line-height:1.19;padding:.48em 0;border-bottom:1px solid #857e8554}
.plate-body{position:relative;min-height:0;min-width:0;display:grid;grid-template-rows:minmax(0,1fr);place-items:center;padding:clamp(6px,1.15vw,18px) 0}
.plate.cover .plate-heading{display:none}

['Воздух','Как примеси доходят до домов','При слабом ветре примеси рассеиваются медленнее. При усилении ветра шлейф вытягивается по направлению потока.','В материалах акимата среди источников запаха сероводорода назван накопитель «Биопруд».','wind',[1,17,22]],
['Ишим','Городской круг воды','Ишим даёт воду городу. После использования стоки проходят через коллекторы, очистные и накопители.','Плановый выпуск городских стоков и технологический выпуск ТЭЦ контролируют отдельно.','cycle',[20,7,8,12]],
['Ишим','Качество воды','В региональной сводке Ишим получил 4-й класс в III квартале 2025 и 2026 годов.','Для 2026 года Казгидромет выделил взвесь и фенолы.','waterclass',[1,9]],
['Ишим','Два створа у города','Выше Петропавловска вода получила 5-й класс, ниже — 4-й. Взвеси ниже города было на 1 мг/дм³ меньше.','Взвесь и фенолы ниже города превышали показатели фонового класса.','samples',[1,9]],
['Ишим','Сбросы под контролем','В июле 2026 года в парных пробах у одного выпуска существенной разницы не нашли.','В октябре прокуратура сообщила о другом случае: незаконном сбросе и вступившем в силу штрафе 174 млн ₸.','events',[12,21]],
['Ишим','Пена на поверхности','Густая пена на Ишиме — наблюдение с берега. Незаконный сброс городских стоков — отдельно подтверждённый случай.','Пену образуют и моющие вещества, и природная органика. По виду пены эти причины не различить.','foam',[10,11,21]],
['Ишим','Весеннее половодье','В 2024 году Ишим вышел из русла. Из-за подтоплений в Петропавловске ввели режим ЧС.','Наиболее уязвимы низкие участки поймы: при подъёме воды они затапливаются первыми.','flood',[6,18,19]],
['Решения','Приоритеты для воздуха','Модернизация газоочистки на ТЭЦ-2 и крупных предприятиях снижает нагрузку у источника.','Данные городских постов показывают результат у жилья. Для сероводорода нужен отдельный контроль эпизодов запаха.','airPlan',[1,3,4,17]],
['Решения','Как защитить Ишим','Контролировать работу очистных и все выпуски. У каждого выпуска нужны повторные пробы выше и ниже по течению.','Защита берегов дополняет контроль стоков. В 2026 году водоохранные зоны установили для 109 водных объектов СКО.','waterPlan',[9,12,20,21,22]],
['Решения','Показатели результата','Более редкие и низкие пики означают улучшение качества воздуха. Меньше превышений у выпусков означает снижение нагрузки на Ишим.','Сопоставимые данные дают одни и те же посты и створы в одинаковые сезоны.','scorecard',[1,4,9,16]],
['Итог','Два приоритета для СКО','Для воздуха — газоочистка на крупных источниках и контроль сероводорода. Для Ишима — надёжная очистка стоков и контроль выпусков.','','end',[1,3,20,21]]

function modelArt(key,graphic) {
 const {label,choices}=modelControls[key];
 return '<div class="model-panel" data-state="0" data-model="'+key+'">'+graphic+'<div class="model-controls" role="group" aria-label="'+label+'"><div class="choices">'+choices.map((option,i)=>'<button type="button" data-mode="'+i+'" aria-pressed="'+(i===0)+'">'+option+'</button>').join('')+'</div><p class="answer" aria-live="polite"></p></div></div>';
}
function mountModel(panel) {
 const buttons=[...panel.querySelectorAll('[data-mode]')];
 const answer=panel.querySelector('.answer');
 const {answers}=modelControls[panel.dataset.model];
 function setMode(mode){
  panel.dataset.state=mode;
  buttons.forEach((button,i)=>button.setAttribute('aria-pressed',String(i===mode)));
  answer.textContent=answers[mode];
 }
 buttons.forEach((button,i)=>button.onclick=()=>setMode(i));
 setMode(0);
}

function go(i, updateHash = true) {
 index = Math.max(0, Math.min(slides.length-1,i));
 const [section,title,description,note,type,refs] = slides[index];
 disposeCover?.();
 disposeCover = undefined;
 const tone=section==='Ишим'||type==='waterPlan'?'water':section==='Воздух'||type==='airPlan'?'air':'paper';
 slide.dataset.tone=tone;
 slide.dataset.layout=type;
 animateWash(index);
 const graphic = type==='cover' ? '<canvas role="img" aria-label="Изометрическая сцена Петропавловска на Ишиме"></canvas>' : graphics[type]();
 slide.innerHTML = '<article class="copy"><div class="story"><div class="eyebrow">'+section+'</div><h1 tabindex="-1">'+title+'</h1></div><div class="analysis"><p>'+description+'</p>'+ (note?'<div class="note">'+note+'</div>':'')+
  (type==='cover'?'<ul class="byline"><li>Саутбек Арлан</li><li>Макаровский Владислав</li><li class="class-year">11 А класс</li></ul>':'')+'</div></article>'+
  '<figure class="plate '+type+'" data-tone="'+tone+'"><div class="plate-heading">'+panelTitles[type]+'</div><div class="plate-body">'+graphic+'</div><figcaption>'+(captions[type]??'')+'</figcaption></figure>';
 document.querySelector('#count').textContent = pad(index+1)+' / '+slides.length;
 document.querySelector('#fill').style.width = (index+1)/slides.length*100+'%';
 prev.disabled = index===0;
 next.disabled = index===slides.length-1;
 if(updateHash){
  const fragment='#'+(index+1);
  if(location.hash!==fragment){
   try {
    const page=new URL(location.href);
    page.hash=fragment;
    history.replaceState(null,'',page);
   } catch {
    location.replace(fragment);
   }
  }
 }
 const canvas = slide.querySelector('canvas');
 if(canvas) disposeCover=mountScene(canvas);
 const panel=slide.querySelector('[data-model]');
 if(panel)mountModel(panel);
}
let desired=0;
let outgoing;
let moveVersion=0;
const ease='cubic-bezier(.19,.78,.24,1)';
function animateWash(page){
 const field=document.querySelector('.backdrop');
 const positions=[(page*19)%43-13,(page*11)%39-19,(page*13)%32-16,(page*17)%25-12,(page*7)%27-13];
 ['--wash-x','--wash-y','--echo-x','--echo-y','--wash-r'].forEach((name,i)=>
  field.style.setProperty(name,positions[i]+['vw','vh','vw','vh','deg'][i]));
}
function appear(type,direction=1){
 if(reduceMotion.matches || typeof slide.animate!=='function')return;
 function reveal(element,keyframes,delay,duration,label){
  if(!element)return;
  const animation=element.animate(keyframes,{delay,duration,easing:ease,fill:'backwards'});
  animation.id=label;
 }
 const fade=[{opacity:0,transform:'translateY(13px)'},{opacity:1,transform:'none'}];
 const selectors=['.eyebrow','h1','.copy p','.note','.byline'];
 selectors.forEach((selector,i)=>reveal(slide.querySelector(selector),fade,28+i*48,460,'text-entrance'));
 reveal(slide.querySelector('.plate-heading'),fade,50,330,'chart-heading');
 reveal(slide.querySelector('figcaption'),fade,175,330,'chart-caption');
 const art=slide.querySelector('.art');
 if(!art){
  reveal(slide.querySelector('canvas'),[{opacity:0,transform:'translateY(19px) scale(.965)'},{opacity:1,transform:'none'}],90,690,'cover-lift');
  return;
 }
 if(type==='bars'||type==='samples'){
  const bars=[...art.querySelectorAll('.chart-in rect')];
  art.querySelectorAll(':scope > text,:scope > path').forEach(element=>reveal(element,fade,42,370,'chart-axis'));
  bars.forEach((bar,i)=>{
   bar.style.transformBox='fill-box';
   bar.style.transformOrigin='50% 100%';
   reveal(bar,[{transform:'scaleY(.02)',opacity:.24},{transform:'scaleY(1)',opacity:1}],145+i*67,560,'bar-rise');
  });
  art.querySelectorAll('.chart-in text,.chart-in path').forEach((element,i)=>
   reveal(element,fade,310+i*30,440,'bar-value'));
 }else if(type==='share'){
  const ring=art.querySelector('[stroke-dasharray]');
  reveal(ring,[{strokeDasharray:'0 100'},{strokeDasharray:'74 26'}],100,900,'ring-trace');
  art.querySelectorAll('text').forEach((element,i)=>reveal(element,fade,145+i*57,480,'ring-label'));
 }else if(type==='peak'){
  art.querySelectorAll('rect').forEach((element,i)=>{
   element.style.transformBox='fill-box';
   element.style.transformOrigin='0% 50%';
   reveal(element,[{opacity:0,transform:'scaleX(.42)'},{opacity:1,transform:'none'}],105+i*40,430,'limit-step');
  });
  art.querySelectorAll('text').forEach((element,i)=>reveal(element,fade,110+i*85,490,'limit-label'));
 }else{
  const from=direction>0?'inset(0 100% 0 0)':'inset(0 0 0 100%)';
  reveal(art,[{opacity:.18,clipPath:from},{opacity:1,clipPath:'inset(0 0 0 0)'}],50,690,'illustration-reveal');
 }
 reveal(slide.querySelector('.model-controls'),fade,180,400,'model-controls');
}
function jumpTo(i,focusTitle=false){
 const target=Math.max(0,Math.min(slides.length-1,i));
 if(target===desired&&target===index)return;
 desired=target;
 const direction=target<index?-1:1;
 const version=++moveVersion;
 outgoing?.cancel();
 const commit=()=>{
  if(version!==moveVersion)return;
  outgoing?.cancel();
  outgoing=undefined;
  go(target);
  if(focusTitle)slide.querySelector('h1').focus({preventScroll:true});
  appear(slides[target][4],direction);
 };
 if(reduceMotion.matches || typeof slide.animate!=='function'){commit();return;}
 outgoing=slide.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateX('+(-direction*16)+'px)'}],
  {duration:155,easing:'ease-in',fill:'forwards'});
 outgoing.finished.then(commit,()=>{});
}

function openDialog(kind) {
 if(kind==='sources'){
  dialogTitle.textContent='Источники';
  const linked=slides[index][5];
  const used=[...new Set(slides.flatMap(item=>item[5]))].sort((a,b)=>a-b);
  const sourceOrder=[...linked,...used.filter(n=>!linked.includes(n))];
  dialogBody.innerHTML='<ol class="sources">'+sourceOrder.map(n=>{
   const [label,url,detail]=sources[n-1];
   return '<li value="'+n+'"><a href="'+url+'" target="_blank" rel="noopener noreferrer">'+label+'</a><small>'+detail+'</small></li>';
  }).join('')+'</ol>';
 }else{
  dialogTitle.textContent='Слайды';
  dialogBody.innerHTML='<nav class="index" aria-label="Список слайдов">'+slides.map((item,i)=>'<button type="button" data-slide="'+i+'" aria-current="'+(i===index)+'">'+pad(i+1)+' · '+item[1]+'</button>').join('')+'</nav>';
 }
 dialog.showModal();
}

function mountScene(canvas){
 const ctx=canvas.getContext('2d');
 if(!ctx)return ()=>{};
 const axes=[{position:0,velocity:0,target:0},{position:0,velocity:0,target:0}];
 let width,height,dpr,frame=0,previous=0,elapsed=0;
 const limit=(value,max)=>Math.max(-max,Math.min(max,value));
 function draw(){
  if(!width || !height)return;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,width,height);
  const scale=Math.min(width/565,height/375);
  ctx.translate(width/2,height*.53);
  ctx.scale(scale,scale);
  const [yaw,pitch]=axes;
  drawLandscape(ctx,elapsed, yaw.position+Math.sin(elapsed*.62)*.017, pitch.position+Math.sin(elapsed*.48)*.012);
 }
 function resize(){
  const box=canvas.getBoundingClientRect();
  width=box.width;
  height=box.height;
  dpr=Math.min(devicePixelRatio,2);
  canvas.width=Math.round(width*dpr);
  canvas.height=Math.round(height*dpr);
  draw();
 }
 canvas.addEventListener('pointermove',event=>{
  if(reduceMotion.matches || event.pointerType!=='mouse')return;
  const bounds=canvas.getBoundingClientRect();
  axes[0].target=(2*(event.clientX-bounds.left)/width-1)*.155;
  axes[1].target=(2*(event.clientY-bounds.top)/height-1)*.105;
 });
 canvas.addEventListener('pointerleave',event=>{
  if(reduceMotion.matches || event.pointerType!=='mouse')return;
  axes.forEach((axis,i)=>{
   axis.target=limit(axis.target*1.17+axis.velocity*.12,i===0?.19:.13);
  });
 });
 function tick(time){
  const dt=previous?Math.min((time-previous)/1000,.032):0;
  previous=time;
  if(!document.hidden){
   elapsed+=dt;
   for(const axis of axes){
    axis.velocity+=((axis.target-axis.position)*18-axis.velocity*5.15)*dt;
    axis.position+=axis.velocity*dt;
   }
   draw();
  }
  frame=requestAnimationFrame(tick);
 }
 function updateMotion(){
  cancelAnimationFrame(frame);
  previous=0;
  if(reduceMotion.matches){
   elapsed=0;
   axes.forEach(axis=>{axis.position=axis.velocity=axis.target=0;});
   draw();
  }else{
   frame=requestAnimationFrame(tick);
  }
 }
 const observer=new ResizeObserver(resize);
 observer.observe(canvas);
 reduceMotion.addEventListener('change',updateMotion);
 resize();
 updateMotion();
 return ()=>{
  cancelAnimationFrame(frame);
  observer.disconnect();
  reduceMotion.removeEventListener('change',updateMotion);
 };
}

function drawLandscape(ctx,time,yaw,pitch){
 const sine=Math.sin(yaw),cosine=Math.cos(yaw);
 const project=(x,y,z=0)=>{
  const px=x*cosine-y*sine;
  const py=x*sine+y*cosine;
  return [(px-py)*.83,(px+py)*(.40+pitch*.65)-z];
 };

 const path=(points,color,stroke,width=1)=>{
  ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));
  if(color){ctx.closePath();ctx.fillStyle=color;ctx.fill();}
  if(stroke){ctx.lineWidth=width;ctx.lineJoin='round';ctx.lineCap='round';ctx.strokeStyle=stroke;ctx.stroke();}
 };
 const poly=(points,...rest)=>path(points.map(p=>project(...p)),...rest);
 function ellipse(x,y,rx,ry,color){
  ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();
 }
 function block(x,y,w,d,h,top,left,right){
  poly([[x+w,y,h],[x+w,y+d,h],[x+w,y+d],[x+w,y]],right);
  poly([[x,y+d,h],[x+w,y+d,h],[x+w,y+d],[x,y+d]],left);
  poly([[x,y,h],[x+w,y,h],[x+w,y+d,h],[x,y+d,h]],top,'#53445850');
 }
 function house(x,y,w,d,h){
  block(x,y,w,d,h,'#f2dbc3','#e0b6a7','#a98794');
  poly([[x-3,y-3,h],[x+w+3,y-3,h],[x+w+3,y+d/2,h+12],[x-3,y+d/2,h+12]],'#b96d72');
  poly([[x-3,y+d/2,h+12],[x+w+3,y+d/2,h+12],[x+w+3,y+d+3,h],[x-3,y+d+3,h]],'#8a516a');
  for(let i=7;i<w-4;i+=9)poly([[x+i,y+d+.12,h-5],[x+i+4,y+d+.12,h-5],[x+i+4,y+d+.12,h-11],[x+i,y+d+.12,h-11]],'#576781');
 }
 function tree(x,y,n){
  const [px,py]=project(x,y);
  ellipse(px+5,py+1,8,3,'#493b5840');
  path([[px,py],[px,py-13]],null,'#78606d',2);
  ellipse(px,py-14,n,n*1.28,'#716e8a');
  ellipse(px-2,py-17,n*.78,n,'#a898a6');
  ellipse(px-4,py-20,n*.34,n*.45,'#d1b1b2');
 }
 function pin(x,y,label){
  const [px,py]=project(x,y,5);
  path([[px,py],[px,py-25]],null,'#753a52',2);
  ellipse(px,py-26,5,5,'#a94d61');
  ctx.font='800 17px Manrope, sans-serif';ctx.textAlign='center';
  const w=ctx.measureText(label).width+16;
  ctx.fillStyle='#f9f3e9';ctx.fillRect(px-w/2,py-53,w,25);
  ctx.fillStyle='#53334c';ctx.fillText(label,px,py-36);
 }
 const dusk=ctx.createRadialGradient(83,-122,6,99,-104,62);
 dusk.addColorStop(0,'#ffe6bd');dusk.addColorStop(1,'#d5858f');
 ellipse(99,-104,61,61,dusk);
 for(let r=70;r<=93;r+=11){ctx.beginPath();ctx.arc(99,-104,r,3.28,5.97);ctx.strokeStyle='#a76d7940';ctx.lineWidth=1;ctx.stroke();}
 ellipse(5,136,232,28,'#46455f1f');
 ellipse(9,132,195,19,'#46455f1f');
 const edge=[[-162,-141],[140,-141],[165,-110],[165,106],[124,139],[-147,139],[-167,108],[-167,-100]];
 poly(edge.map(([x,y])=>[x,y,-28]),'#88768a');
 for(let i=0;i<edge.length;i++){
  const a=edge[i],b=edge[(i+1)%edge.length];
  poly([[...a,0],[...b,0],[...b,-27],[...a,-27]],i<4?'#a78b96':'#846e87');
  poly([[...a,-10],[...b,-10]],null,'#ceb0aa88',2);
 }
 poly(edge,'#dac3b1','#887b93',1.4);
 poly([[-148,103],[-116,95],[-73,98],[-30,85],[21,100],[78,114],[122,125]],null,'#f4e2c3',1.4);
 for(let i=0;i<14;i++){
  const x=-145+i*20;
  poly([[x,-128],[x+9,-128],[x+29,-63],[x+20,-63]],i%2?'#c4a8ae':'#ebd8b9');
 }
 const river=[[-151,97],[-112,77],[-74,74],[-34,49],[-25,10],[-46,-26],[-35,-59],[6,-77],[54,-56],[100,-62],[154,-98]];
 const line=river.map(p=>project(...p));

 for(let i=0;i<43;i++){
  const ratio=((i/43+time*.023)%1)*(line.length-1);

  path([[x-3,y],[x+3,y-1]],null,'#f1eef2aa',1);
 }
 poly([[-130,115],[-105,31],[-56,7],[68,6],[150,30]],null,'#b39ca7',9);
 poly([[-130,115],[-105,31],[-56,7],[68,6],[150,30]],null,'#f0ded3',5);
 for(let i=0;i<45;i++){
  const x=-146+(i*73)%291,y=-121+(i*41)%241;
  const nearWater=river.some(([rx,ry])=>Math.hypot(rx-x,ry-y)<26);
  if(!nearWater && (x<5||y<8||y>96))tree(x,y,4+i%4);
 }
  const plants=[[79,-19,39,25,20],[124,-20,24,27,16]];
  plants.forEach(args=>block(...args,'#bfc0d2','#87839e','#666781'));
  for(let i=0;i<2;i++){
   const x=95+30*i,y=-15;

   const [px,py]=project(x+4,y+4,68+i*10);
   for(let j=0;j<7;j++){

   }

  for(let row=0;row<3;row++)for(let col=0;col<4;col++)house(22+col*30,24+row*24,18+(row+col)%7,13+(col%2)*4,13+(row*7+col*5)%13);
